name: Deploy to Production (baust-obe-training)

on:
  push:
    branches:
      - PRODUCTION

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "production-deploy"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.PRODUCTION_BASE_URL }}/baust-obe-training/
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build with production base path
        env:
          VITE_BASE_URL: /baust-obe-training/
          BASE_URL: /baust-obe-training/
        run: bun run build

      # ============================================================
      # DEPLOYMENT TARGET — Uncomment ONE section below
      # ============================================================

