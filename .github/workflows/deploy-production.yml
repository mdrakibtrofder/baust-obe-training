name: Deploy to GitHub Pages (PRODUCTION branch)

on:
  push:
    branches:
      - PRODUCTION
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build & Deploy (GitHub Pages)
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # This project uses Bun as its package manager (committed lockfile
      # is bun.lock, package-lock.json is gitignored) so we use the
      # official Bun setup action and `bun install --frozen-lockfile`
      # to get reproducible installs on CI. Node.js is still required
      # because `bun run build:ghpages` invokes Vite under the hood.
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # ----------------------------------------------------------------
      # Build the site as a pure client-side SPA using our simple
      # vite.ghpages.config.ts (no TanStack Start / Nitro SSR).
      #
      # BASE_URL is set at build time so all asset URLs, internal <Link>
      # hrefs, and router basepath use the correct project-site subpath.
      #
      # For project pages at https://<user>.github.io/<repo>/ the
      # BASE_URL MUST match your repository name.
      #
      # This repo is currently named "obe-training-hub" so the default
      # below uses /obe-training-hub/. If you rename the repo to
      # "baust-obe-training" change this value to /baust-obe-training/.
      # ----------------------------------------------------------------
      - name: Build SPA
        env:
          BASE_URL: /obe-training-hub/
        run: bun run build:ghpages

      # SPA fallback trick for GitHub Pages: without this, deep links
      # like /obe-training-hub/sar/criterion-3 return a 404 because
      # Pages cannot find a matching static file. Copying index.html
      # to 404.html makes Pages serve our SPA on every unknown route,
      # then TanStack Router takes over and renders the right page.
      - name: Create 404.html SPA fallback
        run: cp dist/index.html dist/404.html

      # Copy favicon from public/ (the simple Vite config doesn't
      # automatically serve public/ like the Start config does).
      - name: Include public assets
        run: |
          if [ -d public ]; then
            cp -R public/* dist/ 2>/dev/null || true
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
