name: Deploy to Production (GitHub Pages)

on:
  push:
    branches:
      - PRODUCTION

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "production-deploy"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages-deploy.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # NOTE: GitHub Pages project sites are served from
      # https://<username>.github.io/<repo-name>/ — this base path MUST match
      # this repository's actual name. This repo is currently named
      # "obe-training-hub", so the base path below is "/obe-training-hub/".
      # If you rename the GitHub repo to "baust-obe-training", change both
      # values below to "/baust-obe-training/" to match.
      - name: Build with production base path
        env:
          VITE_BASE_URL: /obe-training-hub/
          BASE_URL: /obe-training-hub/
        run: bun run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist/client

      - name: Deploy to GitHub Pages
        id: pages-deploy
        uses: actions/deploy-pages@v4
